name: Offline regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      NARRATIVE_USE_OLLAMA: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and generation contract tests (no external model)
        run: python -m unittest discover -s tests -v
      - name: Frozen retrieval questions
        run: |
          python evaluation/retrieval.py --output reports/fallback-baseline.json
          python evaluation/retrieval.py --source team --cases evaluation/team_cases.json --output reports/team-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-${{ github.sha }}
          path: reports/
          retention-days: 7
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      NARRATIVE_USE_OLLAMA: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test tool
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.63.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise generation and cross-story candidate click (offline)
        run: |
          python app.py > "$RUNNER_TEMP/narrative-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node scripts/browser_smoke.cjs
